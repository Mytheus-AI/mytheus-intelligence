name: images

# Builds the two container images mytheus-platform/deploy/compose.prod.yml pulls:
#   ghcr.io/mytheus-ai/mytheus-intelligence  (repo-root Dockerfile; every intelligence process)
#   ghcr.io/mytheus-ai/mytheus-ner           (services/ner_service/Dockerfile)
# Same shape as mytheus-backend's `docker` job: PRs build only, main builds AND pushes.

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mytheus-intelligence
            dockerfile: Dockerfile
          - image: mytheus-ner
            dockerfile: services/ner_service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push on main)
        uses: docker/build-push-action@v6
        with:
          # Both images build from the repo root: the NER Dockerfile copies libs/shared too.
          context: .
          file: ${{ matrix.dockerfile }}
          # PRs build but never push. A PR can come from a fork, and pushing an unreviewed
          # image to the `main` tag the VPS pulls would be a supply-chain hole.
          push: ${{ github.event_name == 'push' }}
          # Two tags on purpose: the SHA tag is the immutable artifact to pin or roll back
          # to, `main` is the moving pointer a deploy follows.
          tags: |
            ghcr.io/mytheus-ai/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/mytheus-ai/${{ matrix.image }}:main
          # Per-image cache scope, or the two matrix legs overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
