// COPY of mytheus-backend/proto/identity.proto (the owner). libs/shared/user_context.py mirrors
// it field for field, and tests/test_agent_runtime.py asserts the mirror matches this file.
// Change it in mytheus-backend first, then copy it here.
syntax = "proto3";

package mytheus.identity.v1;

// GetUserContext is the tight-latency mesh-internal RPC served by
// identity-tenant-service. It is read heavily by the AI tier's agents.
// org_id travels in gRPC metadata (key: "org-id"), not in the message body.
service IdentityService {
  rpc GetUserContext(GetUserContextRequest) returns (UserContext);
  // Authorize is the agent-to-agent PDP (ADR-0013): may an agent whose principal holds
  // grantee_role ask query_class of a target at target_scope? Deny by default: any error,
  // unknown value or missing org answers "deny".
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
}

message GetUserContextRequest {
  string user_id = 1;
}

message UserContext {
  string user_id      = 1;
  string org_id       = 2;
  string email        = 3;
  string role         = 4;  // domain role (e.g. "Backend Engineer") — NOT an RBAC tier
  repeated string skills = 5;
  string bio          = 6;
  string avatar_url   = 7;
  string rbac_tier    = 8;  // "owner" | "admin" | "member"
  repeated string team_ids = 9;
  string department_id = 10;
  int64 cache_expires_at = 11;  // unix ms; cached at nexus:{org_id}:user_ctx:{user_id} 5-min TTL
  // ADR-0038 D4: working profile and agent persona (no avatar seed: no agent needs it)
  repeated string listen_for    = 12;  // at most 15, each 1-100 chars
  repeated string ignore_topics = 13;  // same limits
  string agent_name         = 14;  // display label only; "" = the UI default
  string agent_personality  = 15;  // "balanced" | "concise" | "detailed" | "direct" | "friendly"
  string agent_instructions = 16;  // up to 500 chars of the person's own text; "" = none
}

message AuthorizeRequest {
  string org_id       = 1;
  string grantee_role = 2;  // "owner" | "admin" | "member" (UserContext.rbac_tier)
  string query_class  = 3;  // "meeting_context" | "decision_lineage" | "action_status"
  string target_scope = 4;  // "self" | "same_team" | "department" | "org"
}

message AuthorizeResponse {
  string decision = 1;  // "allow" | "deny"
}
