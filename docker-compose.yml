# Local Qdrant, MinIO and Apache AGE Postgres for mytheus-intelligence.
#
# This repo had no compose file at all, which is the root of status-overview gap 19: the dev
# Qdrant everyone used was started by hand with `docker run` and no API key, so the
# "embedding-service is the only writer" property had nothing enforcing it and the Qdrant tests
# skipped silently whenever nobody happened to have a container up.
#
# Postgres, Redis, Redpanda and the Schema Registry are NOT here on purpose. They are the
# mytheus-backend stack (ports 5443 / 6390 / 9092 / 8081) and this tier shares them; declaring
# them again here would give the two repos two competing definitions of one dependency and,
# worse, a second set of volumes that looks identical until the data diverges.
#
# Port 6333 is Qdrant's default and is deliberately kept, unlike the backend's 5443/6390 shift:
# nothing else in this program binds it.
#
#   docker compose up -d
#
services:
  qdrant:
    network_mode: bridge  # default bridge: daemon is out of address pools for new project networks
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      # Two keys, not one. The write key is held only by embedding-service; every other
      # consumer gets the read-only key, which Qdrant refuses collection creation and upserts
      # for (403 "Global manage access is required") while still allowing search. That is what
      # turns the sole-writer rule from a convention into an infrastructure control.
      #
      # Dev values, and they are dummies by intent: a real deployment supplies both from the
      # secrets manager. They must differ from each other, and libs/shared/qdrant.py refuses to
      # build a client if they do not.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-write}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:-dev-qdrant-read}
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # `/readyz` rather than `/collections`: the latter needs a key once one is configured, so
      # a keyed instance would report itself permanently unhealthy.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for `ingestion-service`. Added for the same reason as Qdrant above: it was
  # a hand-started container with no definition anywhere, so `tests/conftest.py`'s MinIO probe
  # skipped silently on any machine without one, and the ingestion-to-embedding hop could never
  # be run connected end to end.
  #
  # Port 9002 (not MinIO's default 9000) matches what `.env.example` and `conftest.py` already
  # expect, and keeps this off anything else bound to 9000.
  minio:
    network_mode: bridge  # default bridge: daemon is out of address pools for new project networks
    image: minio/minio:latest  # pinned RELEASE tags are not pullable from Docker Hub (verified 2026-11-06); verified build RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9003"
    ports:
      - "9002:9000"
      - "9003:9003"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mytheus}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mytheus-dev-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Apache AGE Postgres for `knowledge-graph-service`'s `nexus_knowledge` graph (Plan 5-6 gap 16).
  #
  # Why a SEPARATE Postgres and not the backend's shared one on 5443: that one is
  # `supabase/postgres:15.8.1.060`, and it does not ship the `age` extension (checked
  # 2026-11-06 by listing every extension `.control` file in the image's layers: no
  # `age.control`). That is risk R1 ("AGE on managed Supabase may be operationally awkward")
  # materializing, and this is its pre-authorized fallback: self-host Postgres+AGE.
  #
  # Port 5434: clear of 5443 (backend Postgres), 6390, 6333, 9002. Only knowledge-graph-service
  # holds AGE_DATABASE_URL. Credentials are dev dummies; a real deployment supplies them from the
  # secrets manager.
  age:
    network_mode: bridge  # default bridge: daemon is out of address pools for new project networks
    image: apache/age:release_PG16_1.6.0
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${AGE_POSTGRES_USER:-nexus_graph}
      POSTGRES_PASSWORD: ${AGE_POSTGRES_PASSWORD:-nexus-graph-dev}
      POSTGRES_DB: nexus_graph
    volumes:
      - agedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d nexus_graph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrantdata:
  miniodata:
  agedata:

