[project]
name = "mytheus-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "langgraph>=0.2",
    "litellm>=1.40",
    "confluent-kafka[avro,schemaregistry]>=2.4",
    "qdrant-client>=1.9",
    "grpcio>=1.63",
    "httpx>=0.27",
    "redis[hiredis]>=5",
]

[project.optional-dependencies]
# Placeholder: real GPU serving (BGE-small-en / BGE-reranker-base on Ray Serve/vLLM)
# lands in the inference band. Not synced by default so the dev loop stays GPU-free.
gpu = ["ray[serve]>=2.20"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "libs"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
